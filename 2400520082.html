<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:#fff;
            width:380px;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            text-align:center;
        }

        .card h1{
            color:#0077cc;
            margin-bottom:20px;
        }

        .info{
            text-align:left;
            margin-top:20px;
        }

        .info p{
            font-size:18px;
            margin:15px 0;
            border-bottom:1px solid #ddd;
            padding-bottom:8px;
        }

        .label{
            font-weight:bold;
            color:#333;
        }

        footer{
            margin-top:20px;
            color:#777;
            font-size:14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Student Profile</h1>

    <div class="info">
        <p><span class="label">Name:</span> Nelakurthi Loukika</p>
        <p><span class="label">ID Number:</span> 2400520082</p>
        <p><span class="label">University:</span> KL University</p>
    </div>

    <footer>
        © 2026 KL University Student Information
    </footer>
</div>
</body>
</html>
